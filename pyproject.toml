[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monsoonfire-laindex"
version = "0.1.0"
description = "Local-first LocalAuctions Arizona auction index"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "pydantic>=2.7", "PyYAML>=6", "typer>=0.12", "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
browser = ["playwright>=1.46"]
test = ["pytest>=8.2"]

[project.scripts]
laindex = "laindex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["laindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
